# Configuration locale complète ; HTTPS sera ajouté pour le VPS.
x-dublao: &dublao
  build: .
  env_file: .env
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    CELERY_BROKER_URL: redis://redis:6379/0

services:
  postgres: 
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requis dans .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requis dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis dans .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-docker-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  init:
    <<: *dublao
    command: python docker/prepare.py
    volumes:
      - static-data:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    <<: *dublao
    # Délai étendu pour les imports ; à dimensionner pour le VPS.
    command: gunicorn dublao.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 1200 --error-logfile -
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static-data:/static:ro
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

  worker:
    <<: *dublao
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: celery -A dublao worker --loglevel=INFO --concurrency=2
    restart: unless-stopped
  beat:
    <<: *dublao
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - beat-docker-data:/var/lib/celery
    command: celery -A dublao beat --loglevel=INFO --schedule=/var/lib/celery/schedule
    restart: unless-stopped
volumes:
  postgres-data:
  static-data:
  redis-docker-data:
  beat-docker-data:



