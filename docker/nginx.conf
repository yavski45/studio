# Docker recrée parfois web avec une autre adresse IP lors d'une reconstruction.
# Résoudre régulièrement le nom du service au lieu de garder l'ancienne IP.
upstream dublao_web {
    zone dublao_web 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    server web:8000 resolve;
}

map $cookie_django_language $error_language {
    default fr;
    en en;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 0;
    client_body_timeout 1200s;
    # Ne pas journaliser les paramètres des liens privés.
    access_log off;
    error_page 400 /__errors/$error_language/400.html;
    error_page 403 /__errors/$error_language/403.html;
    error_page 404 /__errors/$error_language/404.html;
    error_page 500 /__errors/$error_language/500.html;
    error_page 502 /__errors/$error_language/502.html;
    error_page 503 /__errors/$error_language/503.html;
    error_page 504 /__errors/$error_language/504.html;

    location /__errors/ {
        internal;
        alias /static/dublao/errors/;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /static/ {
        alias /static/;
        autoindex off;
    }

    location / {
        proxy_pass http://dublao_web;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
    }
}
